<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#273831"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23273831'/%3E%3Cpath d='M8 31L32 15L56 31M13 34H51M20 34V51M44 34V51M13 51H51' fill='none' stroke='%23d8b878' stroke-width='4'/%3E%3C/svg%3E"><title>东方古韵 · 山水楼阁</title>
  <style>
    :root{color-scheme:dark;--ink:#ede8d9;--muted:#c3c7b7;--gold:#d8b878;--glass:rgba(25,40,35,.72);--line:rgba(220,209,173,.25)}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#738680;font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink)}
    #scene{position:absolute;inset:0}#scene canvas{display:block;width:100%;height:100%;touch-action:none}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
    .masthead{position:absolute;top:36px;left:42px;pointer-events:none;text-shadow:0 2px 16px #17291c66}.eyebrow{font-size:10px;letter-spacing:5px;color:#f3e3bb;display:flex;align-items:center;gap:12px}.eyebrow:before{content:"";display:block;width:30px;height:1px;background:var(--gold)}h1{font-family:"STSong","SimSun",serif;font-size:38px;letter-spacing:8px;font-weight:400;margin:13px 0 9px}.subtitle{font-size:11px;letter-spacing:4px;color:#e5e4d7}.seal{display:inline-flex;vertical-align:middle;width:26px;height:36px;border:1px solid #d3a897;background:#954932a6;color:#f0d4b9;font:13px/15px "SimSun",serif;letter-spacing:0;align-items:center;justify-content:center;margin-left:10px;writing-mode:vertical-rl}
    .topright{position:absolute;right:34px;top:35px;display:flex;gap:10px;align-items:center}.badge{font-size:10px;letter-spacing:2px;padding:9px 13px;background:var(--glass);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(12px)}.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#c5d6a4;margin-right:8px}
    .poem{position:absolute;bottom:135px;left:43px;border-left:1px solid #d8b87888;padding-left:15px;font:15px/2 "STSong","SimSun",serif;letter-spacing:3px;pointer-events:none;text-shadow:0 2px 14px #14291c}.poem small{display:block;font:9px "Segoe UI",sans-serif;letter-spacing:2px;opacity:.6;margin-top:12px}
    .toolbar{position:absolute;bottom:37px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--glass);backdrop-filter:blur(20px);box-shadow:0 10px 50px #09170f26;white-space:nowrap}.group{display:flex;gap:4px}.separator{width:1px;height:23px;background:var(--line)}.toolbar button,.guide button{background:transparent;border:0;border-radius:6px;font-size:12px;letter-spacing:1px;padding:10px 13px;transition:background .2s,color .2s}.toolbar button:hover,.guide button:hover{background:#fff1}.toolbar button.active{background:var(--gold);color:#27382d}.icon{font-size:17px;display:inline-block;margin-right:6px;vertical-align:-1px}.hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:1px;color:#f1f2e1bb;text-shadow:0 1px 6px #153724}
    .guide{position:absolute;right:35px;bottom:136px;max-width:260px;border:1px solid var(--line);border-radius:10px;background:var(--glass);backdrop-filter:blur(18px);overflow:hidden}.guide summary{font-size:11px;letter-spacing:2px;cursor:pointer;padding:13px 17px}.guide .items{display:grid;grid-template-columns:1fr 1fr;padding:0 7px 9px;gap:3px}.guide button{text-align:left;font-size:11px;padding:10px}.info{position:absolute;top:100px;right:34px;width:260px;border:1px solid var(--line);border-radius:12px;background:rgba(22,37,32,.86);backdrop-filter:blur(18px);padding:21px;box-shadow:0 12px 50px #15251c33}.info[hidden]{display:none}.info .number{color:var(--gold);font-size:10px;letter-spacing:3px}.info h2{font-family:"SimSun",serif;font-size:24px;letter-spacing:3px;font-weight:400;margin:13px 0}.info p{font-size:12px;line-height:1.9;color:#d3d7c9;margin:0}.close{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;color:#b9c3b5}.info .tag{display:block;border-top:1px solid var(--line);margin-top:16px;padding-top:11px;color:#bfc7ae;font-size:10px;letter-spacing:2px}
    #pin{position:absolute;width:14px;height:14px;border:1px solid #ffe1a3;border-radius:50%;box-shadow:0 0 0 6px #e9c77e30;pointer-events:none;transform:translate(-50%,-50%);display:none;background:#e0ba6655}.loading{position:absolute;inset:0;z-index:20;display:grid;place-content:center;text-align:center;background:#233b34;transition:opacity .7s}.loading p{font-family:"SimSun",serif;letter-spacing:6px;font-size:24px}.loading small{font-size:11px;letter-spacing:2px;color:#bbcbba}.loading.hide{opacity:0;pointer-events:none}.spinner{margin:0 auto;width:44px;height:44px;border:1px solid #9fae8e44;border-top-color:#d8b878;border-radius:50%;animation:spin 1.2s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .walk-hud{position:absolute;left:34px;bottom:136px;padding:15px 19px;background:var(--glass);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(16px);pointer-events:none}.walk-hud[hidden]{display:none}.walk-hud b{font:21px "SimSun",serif;letter-spacing:4px}.walk-hud span{color:var(--gold);font-size:11px;margin-left:15px}.walk-hud small{display:block;font-size:10px;color:#d3d9c9;margin-top:9px;letter-spacing:1px}.walking .poem{display:none}.walking .masthead h1{font-size:29px}.walkpad{display:none;position:absolute;bottom:174px;left:18px;width:126px;grid-template-columns:repeat(3,40px);gap:3px}.walkpad button{height:40px;border:1px solid var(--line);background:var(--glass);border-radius:9px;touch-action:none;font-size:19px}.walkpad button:first-child{grid-column:2}.walkpad button:nth-child(2){grid-column:1}.walkpad button:active{background:#a68c59}.walking canvas{cursor:grab}.walking canvas:active{cursor:grabbing}
    @media(max-width:700px){.walking .walkpad{display:grid}.walk-hud{left:18px;bottom:315px;padding:10px 12px}.walk-hud small{display:none}.walk-hud b{font-size:17px}.walk-hud span{font-size:9px;margin-left:7px}.walking .guide{bottom:170px}.walking .hint{font-size:8px}.walking .masthead h1{font-size:26px}}
    @media(max-width:700px){.masthead{left:21px;top:23px}h1{font-size:29px;letter-spacing:5px}.eyebrow{font-size:8px;letter-spacing:3px}.subtitle{font-size:9px}.topright{top:23px;right:18px}.badge{font-size:8px;padding:7px 9px}.poem{left:22px;bottom:162px;font-size:12px}.poem small{display:none}.toolbar{bottom:37px;gap:7px;padding:7px 8px;max-width:calc(100% - 22px);flex-wrap:wrap;justify-content:center}.toolbar button{padding:8px 10px;font-size:10px}.toolbar .icon{font-size:13px;margin-right:3px}.hint{font-size:8px;white-space:nowrap}.guide{right:15px;bottom:150px;width:146px}.guide .items{grid-template-columns:1fr}.guide summary{font-size:10px}.info{right:16px;top:123px;width:230px}.poem{display:none}.separator{height:18px}.seal{width:22px;height:30px;font-size:10px}.topright .badge{max-width:90px;text-align:center;line-height:1.5}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  </style>
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/"}}</script>
</head>
<body>
  <main id="scene" aria-label="可旋转、缩放和点击构件的中国古风三维庭院"></main>
  <header class="masthead"><div class="eyebrow">LANDSCAPE · ARCHITECTURE</div><h1>山水楼阁<span class="seal">东方古韵</span></h1><div class="subtitle">一庭山水 · 半卷清风</div></header>
  <div class="topright"><span class="badge"><span class="dot"></span><span id="mode-label">夕照 · 黄昏</span></span></div>
  <aside class="poem">檐角藏山色<br>清池映晚晴<small>A QUIET MOMENT IN THE MOUNTAINS</small></aside>
  <aside class="info" id="info" hidden aria-live="polite"><button class="close" id="close-info" aria-label="关闭构件说明">×</button><span class="number" id="info-number"></span><h2 id="info-title"></h2><p id="info-body"></p><span class="tag" id="info-tag"></span></aside>
  <div id="pin"></div>
  <aside class="walk-hud" id="walk-hud" hidden><b>阿棠</b><span id="walk-location">庭院</span><small>WASD / 方向键移动 · Shift 慢跑 · 拖动调整视角</small></aside>
  <div class="walkpad" aria-label="触屏移动"><button data-move="w" aria-label="向前移动">↑</button><button data-move="a" aria-label="向左移动">←</button><button data-move="s" aria-label="向后移动">↓</button><button data-move="d" aria-label="向右移动">→</button></div>
  <details class="guide"><summary>构件导览</summary><div class="items"><button data-part="roof">重檐歇山</button><button data-part="dougong">层叠斗拱</button><button data-part="column">朱柱木梁</button><button data-part="window">格栅门窗</button><button data-part="bridge">池上石桥</button><button data-part="corridor">环院回廊</button></div></details>
  <nav class="toolbar" aria-label="场景控制"><button id="walk-toggle" aria-pressed="false">♡ 少女漫游</button><span class="separator"></span><div class="group" role="group" aria-label="光照模式"><button data-mode="day" aria-pressed="false"><span class="icon">☀</span>白昼</button><button data-mode="dusk" class="active" aria-pressed="true"><span class="icon">◒</span>黄昏</button><button data-mode="night" aria-pressed="false"><span class="icon">☾</span>夜景</button></div><span class="separator"></span><div class="group" role="group" aria-label="相机视角"><button data-view="front">正面</button><button data-view="bird">鸟瞰</button><button id="reset">↺ 重置</button></div></nav>
  <div class="hint">左键旋转 · 滚轮缩放 · 右键平移 · 点击建筑认识构件</div>
  <div class="loading" id="loading"><div class="spinner"></div><p>山水将入画</p><small id="load-message">正在构筑庭院</small></div>
  <script>addEventListener('error',e=>{const el=document.querySelector('#load-message');if(el)el.textContent='加载未完成：'+e.message+'。请通过本地 HTTP 服务打开。';});</script>
  <script type="module" src="./src/scene.js"></script>
</body></html>
